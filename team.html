<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Team</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'"><i class="ti ti-arrow-left"></i> Dashboard</button>
    <div><h1>Team</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>
  <div class="content">
    <div class="section-header">
      <div class="section-title" style="margin:0">Transport team</div>
      <button class="add-btn admin-only" id="add-btn" onclick="openAdd()"><i class="ti ti-plus"></i> Add</button>
    </div>
    <div id="team-list"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item" href="log.html"><i class="ti ti-plus-circle"></i><span>Log</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item active" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item admin-only" href="admin.html" id="admin-link"><i class="ti ti-settings"></i><span>Admin</span></a>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">Add member</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
var isAdmin=session&&session.role==='admin';
if(session){
  document.getElementById('rb').textContent=isAdmin?'Admin':'Captain';
  if(!isAdmin){document.querySelectorAll('.admin-only').forEach(function(el){el.style.display='none';});}
  render();
}

function render(){
  var team=load('port_team',[]);
  var el=document.getElementById('team-list');
  if(!team.length){el.innerHTML='<div class="empty"><i class="ti ti-users"></i><p>No team members added</p></div>';return;}
  var grouped={};
  team.forEach(function(m){
    var t=m.title||'Other';
    if(!grouped[t])grouped[t]=[];
    grouped[t].push(m);
  });
  var html='';
  Object.keys(grouped).forEach(function(title){
    html+='<div class="section-title" style="margin-top:16px">'+title+'</div>';
    grouped[title].forEach(function(m,gi){
      var i=team.indexOf(m);
      html+='<div class="team-card">'
        +'<div class="team-avatar">'+initials(m.name)+'</div>'
        +'<div style="flex:1">'
        +'<div class="team-name">'+m.name+'</div>'
        +'<div class="team-title">'+(m.vessel?m.vessel+' · ':'')+m.title+'</div>'
        +(m.phone?'<div style="font-size:12px;color:var(--teal);margin-top:2px">'+m.phone+'</div>':'')
        +'</div>'
        +(isAdmin?'<div class="row-actions">'
        +'<button class="icon-btn" onclick="openEdit('+i+')"><i class="ti ti-edit"></i></button>'
        +'<button class="icon-btn danger" onclick="deleteMember('+i+')"><i class="ti ti-trash"></i></button>'
        +'</div>':'')
        +'</div>';
    });
  });
  el.innerHTML=html;
}

function memberForm(m){
  var vessels=load('port_vessels',[]);
  var isEdit=!!m;
  var titles=['Captain','Crew','Engineer','Guest Relations','Dockhand','Manager','Other'];
  return '<div class="form-group"><label class="form-label">Full name <span class="req">*</span></label>'
    +'<input class="form-input" id="m-name" value="'+(isEdit?m.name:'')+'" placeholder="Full name"></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">Job title</label>'
    +'<select class="form-select" id="m-title">'
    +titles.map(function(t){return'<option'+(isEdit&&m.title===t?' selected':'')+'>'+t+'</option>';}).join('')
    +'</select></div>'
    +'<div class="form-group"><label class="form-label">Vessel</label>'
    +'<select class="form-select" id="m-vessel"><option value="">None</option>'
    +vessels.map(function(v){return'<option'+(isEdit&&m.vessel===v.name?' selected':'')+'>'+v.name+'</option>';}).join('')
    +'</select></div>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">Phone</label>'
    +'<input class="form-input" id="m-phone" type="tel" value="'+(isEdit?m.phone||'':'')+'" placeholder="+960..."></div>'
    +'<div class="error-msg" id="m-err"></div>'
    +'<button class="btn btn-primary" onclick="saveMember('+(isEdit?'editIdx':'- 1')+')">'+(isEdit?'Update':'Save')+'</button>';
}

var editIdx=-1;
function openAdd(){editIdx=-1;document.getElementById('modal-title-text').textContent='Add member';document.getElementById('modal-body').innerHTML=memberForm(null);openModal();}
function openEdit(i){editIdx=i;var m=load('port_team',[])[i];document.getElementById('modal-title-text').textContent='Edit member';document.getElementById('modal-body').innerHTML=memberForm(m).replace("'editIdx'",i);openModal();}

function saveMember(i){
  var name=document.getElementById('m-name').value.trim();
  if(!name){var e=document.getElementById('m-err');e.textContent='Enter a name';e.classList.add('show');return;}
  var team=load('port_team',[]);
  var obj={id:i>=0?team[i].id:nextId(team),name:name,title:document.getElementById('m-title').value,vessel:document.getElementById('m-vessel').value,phone:document.getElementById('m-phone').value.trim()};
  if(i>=0)team[i]=obj;else team.push(obj);
  save('port_team',team);
  closeModal();showToast(i>=0?'Member updated':'Member added');render();
}

function deleteMember(i){
  if(!confirm('Remove this team member?'))return;
  var team=load('port_team',[]);
  team.splice(i,1);save('port_team',team);showToast('Member removed');render();
}
</script>
</body>
</html>
