<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Team</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'">
      <i class="ti ti-arrow-left"></i> Home
    </button>
    <div><h1>Team</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>
  <div class="content">
    <div class="section-header">
      <div class="section-title" style="margin:0">Transport team</div>
      <button class="add-btn" id="add-btn" style="display:none" onclick="openAdd()">
        <i class="ti ti-plus"></i> Add member
      </button>
    </div>
    <div id="team-list"><div class="empty"><i class="ti ti-loader"></i><p>Loading...</p></div></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item" href="log.html"><i class="ti ti-plus-circle"></i><span>Log</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item active" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-link" style="display:none">
      <i class="ti ti-settings"></i><span>Admin</span>
    </a>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">Add member</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
var isAdmin=session&&session.role==='admin';
var editingId=-1;

if(session){
  document.getElementById('rb').textContent=isAdmin?'Admin':'Capt. '+session.name;
  if(isAdmin){
    document.getElementById('add-btn').style.display='flex';
    document.getElementById('admin-link').style.display='flex';
  }
  render();
}

async function render(){
  var team=await dbGet('team','&order=title.asc,name.asc');
  var el=document.getElementById('team-list');
  if(!team.length){
    el.innerHTML='<div class="empty"><i class="ti ti-users"></i><p>No team members added</p></div>';
    return;
  }
  var captains=team.filter(function(m){return m.title==='Captain';});
  var crew=team.filter(function(m){return m.title==='Crew';});
  var html='';
  if(captains.length){
    html+='<div class="section-title" style="margin-top:8px">Captains</div>';
    captains.forEach(function(m){html+=memberCard(m);});
  }
  if(crew.length){
    html+='<div class="section-title" style="margin-top:16px">Crew</div>';
    crew.forEach(function(m){html+=memberCard(m);});
  }
  el.innerHTML=html;
}

function memberCard(m){
  return'<div class="team-card">'
    +'<div class="team-avatar">'+initials(m.name)+'</div>'
    +'<div style="flex:1">'
    +'<div class="team-name">'+m.name+'</div>'
    +'<div class="team-title">'+m.title+'</div>'
    +(m.phone?'<div style="font-size:12px;color:var(--teal);margin-top:2px">'+m.phone+'</div>':'')
    +'</div>'
    +(isAdmin?'<div class="row-actions">'
    +'<button class="icon-btn" onclick="openEdit('+m.id+')"><i class="ti ti-edit"></i></button>'
    +'<button class="icon-btn danger" onclick="removeMember('+m.id+')"><i class="ti ti-trash"></i></button>'
    +'</div>':'')
    +'</div>';
}

function memberForm(m){
  var isEdit=!!m;
  return'<div class="form-group"><label class="form-label">Full name <span class="req">*</span></label>'
    +'<input class="form-input" id="m-name" value="'+(isEdit?m.name:'')+'" placeholder="Full name"></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">Role</label>'
    +'<select class="form-select" id="m-title">'
    +'<option'+(isEdit&&m.title==='Captain'?' selected':'')+' value="Captain">Captain</option>'
    +'<option'+(isEdit&&m.title==='Crew'?' selected':'')+' value="Crew">Crew</option>'
    +'</select></div>'
    +'<div class="form-group"><label class="form-label">Phone</label>'
    +'<input class="form-input" id="m-phone" type="tel" value="'+(isEdit?m.phone||'':'')+'" placeholder="+960..."></div>'
    +'</div>'
    +'<div class="error-msg" id="m-err"></div>'
    +'<button class="btn btn-primary" onclick="saveMember()">'+(isEdit?'Update':'Save')+'</button>'
    +(isEdit?'<button class="btn btn-danger" style="margin-top:8px" onclick="removeMember('+m.id+')">Remove</button>':'');
}

function openAdd(){
  editingId=-1;
  document.getElementById('modal-title-text').textContent='Add member';
  document.getElementById('modal-body').innerHTML=memberForm(null);
  openModal();
}

async function openEdit(id){
  editingId=id;
  var team=await dbGet('team','&id=eq.'+id);
  var m=team[0];if(!m)return;
  document.getElementById('modal-title-text').textContent='Edit member';
  document.getElementById('modal-body').innerHTML=memberForm(m);
  openModal();
}

async function saveMember(){
  var name=document.getElementById('m-name').value.trim();
  var err=document.getElementById('m-err');
  if(!name){err.textContent='Enter a name';err.classList.add('show');return;}
  err.classList.remove('show');
  var btn=document.querySelector('#modal-body .btn-primary');
  if(btn){btn.textContent='Saving...';btn.disabled=true;}
  var data={
    name:name,
    title:document.getElementById('m-title').value,
    phone:document.getElementById('m-phone').value.trim(),
    vessel:''
  };
  if(editingId>=0){
    await dbUpdate('team',editingId,data);
    showToast('Member updated','success');
  } else {
    await dbInsert('team',[data]);
    showToast('Member added','success');
  }
  closeModal();render();
}

async function removeMember(id){
  if(!confirm('Remove this team member?'))return;
  await dbDelete('team',id);
  showToast('Member removed');
  closeModal();render();
}
</script>
</body>
</html>
