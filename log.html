<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Log Trip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'">
      <i class="ti ti-arrow-left"></i> Home
    </button>
    <div><h1>Log trip</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>
  <div class="content">
    <div class="form-section">Trip details</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date <span class="req">*</span></label>
        <input class="form-input" type="date" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label">Vessel <span class="req">*</span></label>
        <select class="form-select" id="f-vessel">
          <option value="">Select</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Captain</label>
      <input class="form-input" id="f-captain" readonly style="background:var(--surface);color:var(--text2)">
    </div>
    <div class="form-group">
      <label class="form-label">Crew onboard</label>
      <div id="crew-select-container"><div style="font-size:13px;color:var(--text3);padding:10px">Loading team...</div></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">From <span class="req">*</span></label>
        <input class="form-input" id="f-from" placeholder="e.g. Ithaafushi">
      </div>
      <div class="form-group">
        <label class="form-label">To <span class="req">*</span></label>
        <input class="form-input" id="f-to" placeholder="e.g. Velana Airport">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Transfer type <span class="req">*</span></label>
        <select class="form-select" id="f-type">
          <option value="">Select</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Purpose</label>
        <input class="form-input" id="f-purpose" placeholder="e.g. Departure">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Departure time</label>
        <input class="form-input" type="time" id="f-dep">
      </div>
      <div class="form-group">
        <label class="form-label">Return time</label>
        <input class="form-input" type="time" id="f-ret">
      </div>
    </div>
    <div class="form-section">Fuel</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Fuel start (L) <span class="req">*</span></label>
        <input class="form-input" type="number" id="f-fuel-start" inputmode="decimal" placeholder="120" oninput="calcFuel()">
      </div>
      <div class="form-group">
        <label class="form-label">Fuel end (L) <span class="req">*</span></label>
        <input class="form-input" type="number" id="f-fuel-end" inputmode="decimal" placeholder="96" oninput="calcFuel()">
      </div>
    </div>
    <div class="fuel-calc">
      <div class="fc-val" id="fuel-result">— L</div>
      <div class="fc-lbl">Fuel consumed</div>
    </div>
    <div class="form-group">
      <label class="form-label">Amendment note</label>
      <textarea class="form-textarea" id="f-note" placeholder="Any route changes or notes..."></textarea>
    </div>
    <div class="error-msg" id="f-err" style="margin-bottom:12px"></div>
    <button class="btn btn-primary" onclick="submitLog()">Submit trip log</button>
  </div>
  <div class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item active" href="log.html"><i class="ti ti-plus-circle"></i><span>Log</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-link" style="display:none">
      <i class="ti ti-settings"></i><span>Admin</span>
    </a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth(['captain']);
if(session){
  document.getElementById('rb').textContent='Capt. '+session.name;
  document.getElementById('f-captain').value=session.name;
  document.getElementById('f-date').value=todayStr();
  TRANSFER_TYPES.forEach(function(t){
    document.getElementById('f-type').innerHTML+='<option>'+t+'</option>';
  });
  loadForm();
}

async function loadForm(){
  var vessels=await dbGet('vessels','&order=name.asc');
  var vs=document.getElementById('f-vessel');
  vessels.forEach(function(v){
    vs.innerHTML+='<option>'+v.name+'</option>';
  });
  var team=await dbGet('team','&title=eq.Crew&order=name.asc');
  var container=document.getElementById('crew-select-container');
  if(!team.length){
    container.innerHTML='<div style="font-size:13px;color:var(--text3);padding:10px">No crew members added yet</div>';
    return;
  }
  container.innerHTML='<div id="crew-checkboxes" style="display:flex;flex-direction:column;gap:10px;border:0.5px solid var(--border);border-radius:8px;padding:12px">'
    +team.map(function(m){
      return'<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">'
        +'<input type="checkbox" value="'+m.name+'" style="width:18px;height:18px;cursor:pointer">'
        +'<span>'+m.name+'</span>'
        +'</label>';
    }).join('')
    +'</div>';
}

function calcFuel(){
  var s=parseFloat(document.getElementById('f-fuel-start').value)||0;
  var e=parseFloat(document.getElementById('f-fuel-end').value)||0;
  var c=Math.max(0,e-s);
  document.getElementById('fuel-result').textContent=c>0?c+'L':'— L';
}

async function submitLog(){
  var date=document.getElementById('f-date').value;
  var vessel=document.getElementById('f-vessel').value;
  var from=document.getElementById('f-from').value.trim();
  var to=document.getElementById('f-to').value.trim();
  var type=document.getElementById('f-type').value;
  var fuelStart=parseFloat(document.getElementById('f-fuel-start').value);
  var fuelEnd=parseFloat(document.getElementById('f-fuel-end').value);
  var err=document.getElementById('f-err');

  if(!date||!vessel||!from||!to||!type||isNaN(fuelStart)||isNaN(fuelEnd)){
    err.textContent='Fill in all required fields';err.classList.add('show');return;
  }
  err.classList.remove('show');

  var boxes=document.querySelectorAll('#crew-checkboxes input:checked');
  var crew=Array.from(boxes).map(function(b){return b.value;});
  var consumed=Math.max(0,fuelEnd-fuelStart);

  var btn=document.querySelector('.btn-primary');
  btn.textContent='Saving...';btn.disabled=true;

  var result=await dbInsert('trips',[{
    date:date,
    vessel:vessel,
    captain:session.name,
    crew:crew,
    type:type,
    from_location:from,
    to_location:to,
    purpose:document.getElementById('f-purpose').value.trim(),
    departure:document.getElementById('f-dep').value,
    end_time:document.getElementById('f-ret').value,
    fuel_start:fuelStart,
    fuel_end:fuelEnd,
    consumed:consumed,
    amendment_note:document.getElementById('f-note').value.trim(),
    status:'pending_review'
  }]);

  if(result){
    showToast('Trip logged','success');
    setTimeout(function(){location.href='dashboard.html';},1000);
  } else {
    btn.textContent='Submit trip log';btn.disabled=false;
    err.textContent='Failed to save. Try again.';err.classList.add('show');
  }
}
</script>
</body>
</html>
