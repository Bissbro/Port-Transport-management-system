<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Trip Records</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'">
      <i class="ti ti-arrow-left"></i> Home
    </button>
    <div><h1 id="page-title">Records</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>
  <div class="content">
    <div class="filter-row">
      <div class="filter-chip active" onclick="filterType(this,'')">All</div>
      <div class="filter-chip" onclick="filterType(this,'Host')">Host</div>
      <div class="filter-chip" onclick="filterType(this,'Guest')">Guest</div>
      <div class="filter-chip" onclick="filterType(this,'Front Office')">Front Office</div>
      <div class="filter-chip" onclick="filterType(this,'Housekeeping')">Housekeeping</div>
      <div class="filter-chip" onclick="filterType(this,'Engineering')">Engineering</div>
      <div class="filter-chip" onclick="filterType(this,'Water Sports')">Water Sports</div>
      <div class="filter-chip" onclick="filterType(this,'F&B')">F&B</div>
      <div class="filter-chip" onclick="filterType(this,'HR')">HR</div>
      <div class="filter-chip" onclick="filterType(this,'HOD')">HOD</div>
      <div class="filter-chip" onclick="filterType(this,'GM')">GM</div>
      <div class="filter-chip" onclick="filterType(this,'RM')">RM</div>
    </div>
    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group" style="margin:0">
        <input class="form-input" type="date" id="f-from" onchange="render()">
      </div>
      <div class="form-group" style="margin:0">
        <input class="form-input" type="date" id="f-to" onchange="render()">
      </div>
    </div>
    <div id="records-list"><div class="empty"><i class="ti ti-loader"></i><p>Loading...</p></div></div>
  </div>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>

<div class="modal-overlay" id="detail-modal" onclick="closeModalOutside(event,'detail-modal')">
  <div class="modal" style="max-height:92vh;overflow-y:auto">
    <div class="modal-title">
      <span id="detail-modal-title">Trip detail</span>
      <button class="close-btn" onclick="closeModal('detail-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div id="detail-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
var isAdmin=session&&session.role==='admin';
var currentType='';

if(session){
  document.getElementById('rb').textContent=isAdmin?'Admin':'Capt. '+session.name;
  if(!isAdmin)document.getElementById('page-title').textContent='My logs';

  if(isAdmin){
    document.getElementById('bottom-nav').innerHTML=
      navItem('ti-layout-dashboard','Home','dashboard.html',false)
      +navItem('ti-list','Records','records.html',true)
      +navItem('ti-sailboat','Vessels','vessels.html',false)
      +navItem('ti-users','Team','team.html',false)
      +navItem('ti-settings','Admin','admin.html',false);
  } else {
    document.getElementById('bottom-nav').innerHTML=
      navItem('ti-layout-dashboard','Home','dashboard.html',false)
      +navItem('ti-plus-circle','Log','log.html',false)
      +navItem('ti-list','My logs','records.html',true)
      +navItem('ti-sailboat','Vessels','vessels.html',false)
      +navItem('ti-users','Team','team.html',false);
  }
  render();
}

function navItem(icon,label,href,active){
  return'<a class="nav-item'+(active?' active':'')+'" href="'+href+'">'
    +'<i class="ti '+icon+'"></i><span>'+label+'</span></a>';
}

async function render(){
  var from=document.getElementById('f-from').value;
  var to=document.getElementById('f-to').value;
  var filter='&order=created_at.desc';
  if(!isAdmin)filter+='&captain=eq.'+encodeURIComponent(session.name);
  if(from)filter+='&date=gte.'+from;
  if(to)filter+='&date=lte.'+to;
  if(currentType)filter+='&type=eq.'+encodeURIComponent(currentType);
  var trips=await dbGet('trips',filter);
  var el=document.getElementById('records-list');
  if(!trips.length){
    el.innerHTML='<div class="empty"><i class="ti ti-map-route"></i><p>No trips found</p></div>';
    return;
  }
  el.innerHTML=trips.map(function(t){return tripCard(t);}).join('');
}

function tripCard(t){
  var route=(t.from_location&&t.to_location)?t.from_location+' → '+t.to_location:'—';
  var crewStr=Array.isArray(t.crew)?t.crew.join(', '):t.crew||'';
  return'<div class="trip-card" onclick="viewDetail('+t.id+')" style="cursor:pointer">'
    +'<div class="tc-head">'
    +'<div class="vessel-name">'+t.vessel+'</div>'
    +'<span class="pill pill-date">'+fmtDate(t.date)+'</span>'
    +'</div>'
    +'<div class="tc-route">'+route+(t.purpose?' · '+t.purpose:'')+'</div>'
    +'<div class="tc-meta">'
    +'<span class="pill '+(t.type==='Host'?'pill-host':t.type==='Guest'?'pill-guest':'pill-dept')+'">'+t.type+'</span>'
    +(t.consumed!=null?'<span class="pill pill-fuel">'+t.consumed+'L</span>':'')
    +'<span class="pill pill-cap">'+t.captain+'</span>'
    +(t.departure?'<span class="pill pill-date"><i class="ti ti-clock" style="font-size:10px;margin-right:2px"></i>'+t.departure+'</span>':'')
    +(crewStr?'<span class="pill pill-date">'+crewStr+'</span>':'')
    +'</div>'
    +'</div>';
}

async function viewDetail(id){
  var trips=await dbGet('trips','&id=eq.'+id);
  var t=trips[0];if(!t)return;
  var route=(t.from_location&&t.to_location)?t.from_location+' → '+t.to_location:'—';
  var crewStr=Array.isArray(t.crew)?t.crew.join(', '):t.crew||'—';
  document.getElementById('detail-modal-title').textContent=t.vessel+' · '+fmtDate(t.date);
  document.getElementById('detail-modal-body').innerHTML=''
    +'<div class="trip-detail-section">'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Vessel</span><span class="trip-detail-val">'+t.vessel+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Type</span><span class="trip-detail-val">'+t.type+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">From</span><span class="trip-detail-val">'+(t.from_location||'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">To</span><span class="trip-detail-val">'+(t.to_location||'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Purpose</span><span class="trip-detail-val">'+(t.purpose||'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Captain</span><span class="trip-detail-val">'+t.captain+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Crew</span><span class="trip-detail-val">'+crewStr+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Departure</span><span class="trip-detail-val">'+(t.departure||'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Return</span><span class="trip-detail-val">'+(t.end_time||'—')+'</span></div>'
    +'</div>'
    +'<div class="trip-detail-section">'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Fuel start</span><span class="trip-detail-val">'+(t.fuel_start!=null?t.fuel_start+'L':'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Fuel end</span><span class="trip-detail-val">'+(t.fuel_end!=null?t.fuel_end+'L':'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Consumed</span><span class="trip-detail-val" style="color:var(--teal);font-weight:700">'+(t.consumed!=null?t.consumed+'L':'—')+'</span></div>'
    +'</div>'
    +(t.amendment_note?'<div class="trip-detail-section"><div style="font-size:12px;color:var(--text3);margin-bottom:4px">Amendment note</div><div style="font-size:13px">'+t.amendment_note+'</div></div>':'')
    +'<div class="action-bar">'
    +(isAdmin?'<button class="btn btn-danger" style="flex:1" onclick="deleteLog('+t.id+')">Delete</button>':'')
    +'</div>';
  openModal('detail-modal');
}

async function deleteLog(id){
  if(!confirm('Delete this trip record?'))return;
  await dbDelete('trips',id);
  closeModal('detail-modal');
  showToast('Record deleted');
  render();
}

function filterType(el,type){
  currentType=type;
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  render();
}
</script>
</body>
</html>
