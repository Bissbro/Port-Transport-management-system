<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Schedule</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'">
      <i class="ti ti-arrow-left"></i> Home
    </button>
    <div><h1>Schedule</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>

  <div class="subnav">
    <button class="subnav-tab active" onclick="switchTab(this,'today')">Today</button>
    <button class="subnav-tab" onclick="switchTab(this,'pending')">Pending</button>
    <button class="subnav-tab" onclick="switchTab(this,'completed')">Completed</button>
    <button class="subnav-tab" onclick="switchTab(this,'all')">All trips</button>
  </div>

  <div class="content">
    <!-- Today tab -->
    <div id="tab-today">
      <div class="section-header" style="margin-bottom:16px">
        <div>
          <div class="section-title" style="margin:0" id="today-label">Today</div>
          <div style="font-size:12px;color:var(--text3)" id="today-date"></div>
        </div>
        <button class="add-btn" id="add-btn" style="display:none" onclick="openAddTrip()">
          <i class="ti ti-plus"></i> Add trip
        </button>
      </div>
      <div id="today-list"></div>
    </div>

    <!-- Pending tab -->
    <div id="tab-pending" style="display:none">
      <div class="section-title">Pending review</div>
      <div id="pending-list"></div>
    </div>

    <!-- Completed tab -->
    <div id="tab-completed" style="display:none">
      <div class="section-title">Completed & verified</div>
      <div id="completed-list"></div>
    </div>

    <!-- All tab -->
    <div id="tab-all" style="display:none">
      <div class="section-header" style="margin-bottom:16px">
        <div class="section-title" style="margin:0">All trips</div>
        <div style="display:flex;gap:8px">
          <input type="date" class="form-input" id="filter-date" style="width:auto;font-size:13px;padding:8px 10px" onchange="renderAll()">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-chip active" onclick="filterType(this,'')">All</div>
        <div class="filter-chip" onclick="filterType(this,'Host')">Host</div>
        <div class="filter-chip" onclick="filterType(this,'Guest')">Guest</div>
        <div class="filter-chip" onclick="filterType(this,'Front Office')">Front Office</div>
        <div class="filter-chip" onclick="filterType(this,'Housekeeping')">Housekeeping</div>
        <div class="filter-chip" onclick="filterType(this,'Engineering')">Engineering</div>
        <div class="filter-chip" onclick="filterType(this,'Water Sports')">Water Sports</div>
      </div>
      <div id="all-list"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item active" href="schedule.html"><i class="ti ti-calendar"></i><span>Schedule</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-link" style="display:none">
      <i class="ti ti-settings"></i><span>Admin</span>
    </a>
  </div>
</div>

<!-- Trip detail modal -->
<div class="modal-overlay" id="detail-modal" onclick="closeModalOutside(event,'detail-modal')">
  <div class="modal" style="max-height:92vh;overflow-y:auto">
    <div class="modal-title">
      <span id="detail-modal-title">Trip detail</span>
      <button class="close-btn" onclick="closeModal('detail-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div id="detail-modal-body"></div>
  </div>
</div>

<!-- Add/Edit/Start/End trip modal -->
<div class="modal-overlay" id="form-modal" onclick="closeModalOutside(event,'form-modal')">
  <div class="modal" style="max-height:92vh;overflow-y:auto">
    <div class="modal-title">
      <span id="form-modal-title">Add trip</span>
      <button class="close-btn" onclick="closeModal('form-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div id="form-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
var isAdmin=session&&session.role==='admin';
var currentTypeFilter='';

if(session){
  document.getElementById('rb').textContent=isAdmin?'Admin':'Captain: '+session.name;
  if(isAdmin){
    document.getElementById('add-btn').style.display='flex';
    document.getElementById('admin-link').style.display='flex';
  }
  var d=new Date();
  document.getElementById('today-date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  renderSchedule();
}

function renderSchedule(){
  renderToday();
  renderPending();
  renderCompleted();
}

function renderToday(){
  var today=todayStr();
  var trips=load('port_trips',[]).filter(function(t){return t.date===today;});
  if(session.role==='captain'){
    var mine=trips.filter(function(t){return t.captain===session.name;});
    var others=trips.filter(function(t){return t.captain!==session.name;});
    trips=mine.concat(others);
  }
  trips.sort(function(a,b){return(a.departure||'').localeCompare(b.departure||'');});
  document.getElementById('today-label').textContent='Today — '+trips.length+' trip'+(trips.length!==1?'s':'');
  var el=document.getElementById('today-list');
  el.innerHTML=trips.length
    ?trips.map(function(t){return tripCardHTML(t,session,true);}).join('')
    :'<div class="empty"><i class="ti ti-calendar"></i><p>No trips today</p></div>';
}

function renderPending(){
  var trips=load('port_trips',[]).filter(function(t){
    return t.status===STATUS.PENDING||t.status===STATUS.CORRECTION;
  });
  var el=document.getElementById('pending-list');
  el.innerHTML=trips.length
    ?trips.map(function(t){return tripCardHTML(t,session,false);}).join('')
    :'<div class="empty"><i class="ti ti-clock"></i><p>No pending trips</p></div>';
}

function renderCompleted(){
  var trips=load('port_trips',[]).filter(function(t){
    return t.status===STATUS.VERIFIED;
  }).slice().reverse();
  var el=document.getElementById('completed-list');
  el.innerHTML=trips.length
    ?trips.map(function(t){return tripCardHTML(t,session,false);}).join('')
    :'<div class="empty"><i class="ti ti-check"></i><p>No completed trips</p></div>';
}

function renderAll(){
  var dateFilter=document.getElementById('filter-date').value;
  var trips=load('port_trips',[]).slice().reverse();
  if(dateFilter)trips=trips.filter(function(t){return t.date===dateFilter;});
  if(currentTypeFilter)trips=trips.filter(function(t){return t.type===currentTypeFilter;});
  var el=document.getElementById('all-list');
  el.innerHTML=trips.length
    ?trips.map(function(t){return tripCardHTML(t,session,false);}).join('')
    :'<div class="empty"><i class="ti ti-map-route"></i><p>No trips found</p></div>';
}

function filterType(el,type){
  currentTypeFilter=type;
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  renderAll();
}

function switchTab(el,name){
  document.querySelectorAll('.subnav-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  ['today','pending','completed','all'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===name?'block':'none';
  });
  if(name==='all')renderAll();
  if(name==='pending')renderPending();
  if(name==='completed')renderCompleted();
  if(name==='today')renderToday();
}

function openAddTrip(){
  var vessels=load('port_vessels',[]);
  var team=load('port_team',[]);
  document.getElementById('form-modal-title').textContent='Schedule a trip';
  document.getElementById('form-modal-body').innerHTML=buildTripForm(null,vessels,team);
  openModal('form-modal');
}

function openTripDetailFromCard(id){
  openTripDetail(id);
}
</script>
</body>
</html>
