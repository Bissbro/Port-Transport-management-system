<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Schedule</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="topbar-back" onclick="location.href='dashboard.html'"><i class="ti ti-arrow-left"></i> Dashboard</button>
    <div><h1>Schedule</h1></div>
    <span class="role-badge" id="rb"></span>
  </div>
  <div class="content">
    <div class="form-group">
      <input class="form-input" type="date" id="sched-date" onchange="renderSchedule()">
    </div>
    <div class="section-header">
      <div class="section-title" style="margin:0" id="sched-label">Today</div>
      <button class="add-btn" id="add-btn" style="display:none" onclick="openAddTrip()">
        <i class="ti ti-plus"></i> Add trip
      </button>
    </div>
    <div id="schedule-list"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item active" href="schedule.html"><i class="ti ti-calendar"></i><span>Schedule</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-link" style="display:none"><i class="ti ti-settings"></i><span>Admin</span></a>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" style="max-height:90vh">
    <div class="modal-title">
      <span id="modal-title-text">Add trip</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
var isAdmin=session&&session.role==='admin';
if(session){
  document.getElementById('rb').textContent=isAdmin?'Admin':'Captain: '+session.name;
  if(isAdmin){
    document.getElementById('add-btn').style.display='flex';
    document.getElementById('admin-link').style.display='flex';
  }
  document.getElementById('sched-date').value=todayStr();
  renderSchedule();
}

function renderSchedule(){
  var date=document.getElementById('sched-date').value;
  var trips=load('port_trips',[]).filter(function(t){return t.date===date;});
  if(session.role==='captain'){
    var mine=trips.filter(function(t){return t.captain===session.name;});
    var others=trips.filter(function(t){return t.captain!==session.name;});
    trips=mine.concat(others);
  }
  var label=date===todayStr()?'Today':''+fmtDate(date);
  document.getElementById('sched-label').textContent=label+' — '+trips.length+' trips';
  var el=document.getElementById('schedule-list');
  if(!trips.length){
    el.innerHTML='<div class="empty"><i class="ti ti-calendar"></i><p>No trips scheduled</p></div>';
    return;
  }
  trips.sort(function(a,b){return(a.departure||'').localeCompare(b.departure||'');});
  el.innerHTML=trips.map(function(t){
    return tripCardHTML(t,session,true);
  }).join('');
}

function viewTrip(id){
  window.location.href=BASE+'dashboard.html';
}

function startTrip(id){
  window.location.href=BASE+'dashboard.html';
}

function endTrip(id){
  window.location.href=BASE+'dashboard.html';
}

function openAddTrip(){
  var vessels=load('port_vessels',[]);
  var team=load('port_team',[]);
  var date=document.getElementById('sched-date').value;
  document.getElementById('modal-title-text').textContent='Schedule a trip';
  document.getElementById('modal-body').innerHTML=
    '<div class="form-group"><label class="form-label">Date</label>'
    +'<input class="form-input" type="date" id="s-date" value="'+date+'"></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">Vessel <span class="req">*</span></label>'
    +'<select class="form-select" id="s-vessel" onchange="autoFillCaptain()">'
    +'<option value="">Select</option>'
    +vessels.map(function(v){return'<option>'+v.name+'</option>';}).join('')
    +'</select></div>'
    +'<div class="form-group"><label class="form-label">Type</label>'
    +'<select class="form-select" id="s-type"><option>Host</option><option>Guest</option></select></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">Captain <span class="req">*</span></label>'
    +'<select class="form-select" id="s-captain"><option value="">Select</option>'
    +team.filter(function(m){return m.title==='Captain';}).map(function(m){return'<option>'+m.name+'</option>';}).join('')
    +'</select></div>'
    +'<div class="form-group"><label class="form-label">Departure</label>'
    +'<input class="form-input" type="time" id="s-dep"></div>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">Crew</label>'
    +'<input class="form-input" id="s-crew" placeholder="Crew names..."></div>'
    +'<div class="form-group"><label class="form-label">Route <span class="req">*</span></label>'
    +'<input class="form-input" id="s-route" placeholder="e.g. Jaani to Airport"></div>'
    +'<div class="form-group"><label class="form-label">Purpose</label>'
    +'<input class="form-input" id="s-purpose" placeholder="e.g. Guest departure"></div>'
    +'<div class="error-msg" id="s-err"></div>'
    +'<button class="btn btn-primary" onclick="saveTrip()">Schedule trip</button>';
  openModal();
}

function autoFillCaptain(){
  var vesselName=document.getElementById('s-vessel').value;
  var vessels=load('port_vessels',[]);
  var v=vessels.find(function(x){return x.name===vesselName;});
  if(v&&v.captain){
    var sel=document.getElementById('s-captain');
    for(var i=0;i<sel.options.length;i++){
      if(sel.options[i].value===v.captain){sel.selectedIndex=i;break;}
    }
  }
}

function saveTrip(){
  var vessel=document.getElementById('s-vessel').value;
  var captain=document.getElementById('s-captain').value;
  var route=document.getElementById('s-route').value.trim();
  if(!vessel||!captain||!route){
    var e=document.getElementById('s-err');e.textContent='Fill in required fields';e.classList.add('show');return;
  }
  var trips=load('port_trips',[]);
  trips.push({
    id:nextId(trips),
    date:document.getElementById('s-date').value,
    vessel:vessel,
    captain:captain,
    crew:document.getElementById('s-crew').value.trim(),
    type:document.getElementById('s-type').value,
    route:route,
    actual_route:route,
    purpose:document.getElementById('s-purpose').value.trim(),
    departure:document.getElementById('s-dep').value,
    status:STATUS.SCHEDULED,
    fuelStart:undefined,fuelEnd:undefined,consumed:undefined,
    fuelStartImg:'',fuelEndImg:'',
    amendment_note:'',admin_note:''
  });
  save('port_trips',trips);
  closeModal();showToast('Trip scheduled','success');renderSchedule();
}
</script>
</body>
</html>
