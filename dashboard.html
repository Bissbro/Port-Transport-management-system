<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div><h1>PORT</h1><div class="topbar-sub" id="top-date"></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="role-badge" id="rb"></span>
      <button onclick="logout()" style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px">Out</button>
    </div>
  </div>
  <div class="content">
    <div class="stat-grid" id="stats-grid"></div>
    <div class="section-title" style="margin-top:8px">Quick access</div>
    <div class="dashboard-grid" id="cards-grid"></div>
  </div>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>
<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
if(session){
  var isAdmin=session.role==='admin';
  document.getElementById('rb').textContent=isAdmin?'Admin':'Capt. '+session.name;
  document.getElementById('top-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  renderDashboard();
}

function sc(val,lbl,sub){
  return'<div class="stat-card"><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div><div class="sub">'+sub+'</div></div>';
}
function dc(icon,color,label,sub,href){
  return'<div class="dashboard-card" onclick="location.href=\''+href+'\'">'
    +'<div class="dc-icon '+color+'"><i class="ti '+icon+'"></i></div>'
    +'<div><div class="dc-label">'+label+'</div><div class="dc-sub">'+sub+'</div></div>'
    +'</div>';
}
function ni(icon,label,href,active){
  return'<a class="nav-item'+(active?' active':'')+'" href="'+href+'"><i class="ti '+icon+'"></i><span>'+label+'</span></a>';
}

async function renderDashboard(){
  var isAdmin=session.role==='admin';
  var today=todayStr();
  var allTrips=await dbGet('trips');
  var vessels=await dbGet('vessels');
  var team=await dbGet('team');

  if(isAdmin){
    var todayTrips=allTrips.filter(function(t){return t.date===today;});
    var totalFuel=allTrips.reduce(function(a,t){return a+(parseFloat(t.consumed)||0);},0);
    var active=vessels.filter(function(v){return v.status==='active';}).length;
    document.getElementById('stats-grid').innerHTML=
      sc(allTrips.length,'Total logs','All time')
      +sc(todayTrips.length,'Today','Trips logged')
      +sc(totalFuel+'L','Total fuel','All trips')
      +sc(vessels.length,'Vessels',active+' active');
    document.getElementById('cards-grid').innerHTML=
      dc('ti-list','dc-navy','Log records','View all trips','records.html')
      +dc('ti-sailboat','dc-amber','Vessels','Fleet management','vessels.html')
      +dc('ti-users','dc-navy2','Team','Manage team','team.html')
      +dc('ti-checklist','dc-purple','Checklist','Boat inspection','checklist.html')
      +dc('ti-droplet','dc-teal','Fuel report','Consumption data','fuel-report.html')
      +dc('ti-settings','dc-rose','Admin','Settings','admin.html');
    document.getElementById('bottom-nav').innerHTML=
      ni('ti-layout-dashboard','Home','dashboard.html',true)
      +ni('ti-list','Records','records.html',false)
      +ni('ti-sailboat','Vessels','vessels.html',false)
      +ni('ti-users','Team','team.html',false)
      +ni('ti-settings','Admin','admin.html',false);
  } else {
    var myTrips=allTrips.filter(function(t){return t.captain===session.name;});
    var myToday=myTrips.filter(function(t){return t.date===today;});
    var myFuel=myTrips.reduce(function(a,t){return a+(parseFloat(t.consumed)||0);},0);
    var active=vessels.filter(function(v){return v.status==='active';}).length;
    document.getElementById('stats-grid').innerHTML=
      sc(myToday.length,'Today','Your trips')
      +sc(myTrips.length,'Total','Your logs')
      +sc(myFuel+'L','Fuel used','Your total')
      +sc(vessels.length,'Vessels',active+' active');
    document.getElementById('cards-grid').innerHTML=
      '<div class="dashboard-card" style="grid-column:1/-1" onclick="location.href=\'log.html\'">'
      +'<div style="display:flex;align-items:center;gap:14px">'
      +'<div class="dc-icon dc-rose"><i class="ti ti-plus-circle"></i></div>'
      +'<div><div class="dc-label">Log a trip</div><div class="dc-sub">Record completed transfer</div></div>'
      +'</div></div>'
      +dc('ti-list','dc-navy','My logs','Your trip records','records.html')
      +dc('ti-sailboat','dc-amber','Vessels','Fleet status','vessels.html')
      +dc('ti-users','dc-navy2','Team','Transport team','team.html')
      +dc('ti-checklist','dc-purple','Checklist','Boat inspection','checklist.html');
    document.getElementById('bottom-nav').innerHTML=
      ni('ti-layout-dashboard','Home','dashboard.html',true)
      +ni('ti-plus-circle','Log','log.html',false)
      +ni('ti-list','My logs','records.html',false)
      +ni('ti-sailboat','Vessels','vessels.html',false)
      +ni('ti-users','Team','team.html',false);
  }
}
</script>
</body>
</html>
