<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div><h1>PORT</h1><div class="topbar-sub" id="top-date"></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="role-badge" id="rb"></span>
      <button onclick="logout()" style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px">Out</button>
    </div>
  </div>
  <div class="content">
    <div class="stat-grid">
      <div class="stat-card"><div class="val" id="s-today">0</div><div class="lbl">Trips today</div><div class="sub" id="s-today-sub">—</div></div>
      <div class="stat-card"><div class="val" id="s-fuel">0L</div><div class="lbl">Fuel today</div><div class="sub">Verified only</div></div>
      <div class="stat-card"><div class="val" id="s-pending">0</div><div class="lbl">Pending review</div><div class="sub" id="s-pending-sub">—</div></div>
      <div class="stat-card"><div class="val" id="s-total">0</div><div class="lbl">Total trips</div><div class="sub">All time</div></div>
    </div>
    <div id="my-trips-section" style="display:none">
      <div class="section-title">Your trips today</div>
      <div id="my-trips-list"></div>
    </div>
    <div class="section-title" id="all-trips-label">Recent trips</div>
    <div id="all-trips-list"></div>
    <div class="section-title" style="margin-top:16px">Quick access</div>
    <div class="dashboard-grid">
      <div class="dashboard-card" onclick="location.href='fuel-report.html'">
        <div class="dc-icon dc-teal"><i class="ti ti-droplet"></i></div>
        <div><div class="dc-label">Fuel report</div><div class="dc-sub">Consumption</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='schedule.html'">
        <div class="dc-icon dc-navy"><i class="ti ti-calendar"></i></div>
        <div><div class="dc-label">Schedule</div><div class="dc-sub" id="dc-sched-sub">Today's trips</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='vessels.html'">
        <div class="dc-icon dc-amber"><i class="ti ti-sailboat"></i></div>
        <div><div class="dc-label">Vessels</div><div class="dc-sub" id="dc-vessel-sub">Fleet</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='checklist.html'">
        <div class="dc-icon dc-purple"><i class="ti ti-checklist"></i></div>
        <div><div class="dc-label">Checklist</div><div class="dc-sub">Inspection</div></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <a class="nav-item active" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item" href="schedule.html"><i class="ti ti-calendar"></i><span>Schedule</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-link" style="display:none"><i class="ti ti-settings"></i><span>Admin</span></a>
  </div>
</div>

<!-- Trip detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" style="max-height:90vh">
    <div class="modal-title">
      <span id="modal-title-text">Trip detail</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
if(session){
  var isAdmin=session.role==='admin';
  document.getElementById('rb').textContent=isAdmin?'Admin':'Captain: '+session.name;
  document.getElementById('top-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  if(isAdmin)document.getElementById('admin-link').style.display='flex';
  renderDashboard();
}

function renderDashboard(){
  var trips=load('port_trips',[]);
  var vessels=load('port_vessels',[]);
  var today=todayStr();
  var todayTrips=trips.filter(function(t){return t.date===today;});
  var verifiedFuel=todayTrips.filter(function(t){return t.status===STATUS.VERIFIED;}).reduce(function(a,t){return a+(t.consumed||0);},0);
  var pending=trips.filter(function(t){return t.status===STATUS.PENDING;});
  var active=vessels.filter(function(v){return v.status==='active';}).length;

  document.getElementById('s-today').textContent=todayTrips.length;
  document.getElementById('s-today-sub').textContent=todayTrips.length+' scheduled';
  document.getElementById('s-fuel').textContent=verifiedFuel+'L';
  document.getElementById('s-pending').textContent=pending.length;
  document.getElementById('s-pending-sub').textContent=session.role==='admin'?'Need approval':'Awaiting admin';
  document.getElementById('s-total').textContent=trips.length;
  document.getElementById('dc-sched-sub').textContent=todayTrips.length+' today';
  document.getElementById('dc-vessel-sub').textContent=vessels.length+' vessels, '+active+' active';

  if(session.role==='captain'){
    var myTrips=todayTrips.filter(function(t){return t.captain===session.name;});
    if(myTrips.length){
      document.getElementById('my-trips-section').style.display='block';
      document.getElementById('my-trips-list').innerHTML=myTrips.map(function(t){
        return tripCardHTML(t,session,true);
      }).join('');
    }
    document.getElementById('all-trips-label').textContent='All trips';
  }

  var recent=trips.slice().reverse().slice(0,5);
  document.getElementById('all-trips-list').innerHTML=recent.length
    ?recent.map(function(t){return tripCardHTML(t,session,false);}).join('')
    :'<div class="empty"><i class="ti ti-map-route"></i><p>No trips yet</p></div>';
}

function viewTrip(id){
  var trips=load('port_trips',[]);
  var t=trips.find(function(x){return x.id===id;});
  if(!t)return;
  var isAdmin=session.role==='admin';
  var canEdit=canEditTrip(session,t);
  var canStart=canStartTrip(session,t);
  var canEnd=canEndTrip(session,t);

  document.getElementById('modal-title-text').textContent=t.vessel+' · '+fmtDate(t.date);
  document.getElementById('modal-body').innerHTML=
    '<div style="margin-bottom:12px">'+statusBadge(t.status)+'</div>'
    +'<div class="trip-detail-section">'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Vessel</span><span class="trip-detail-val">'+t.vessel+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Captain</span><span class="trip-detail-val">'+t.captain+'</span></div>'
    +(t.crew?'<div class="trip-detail-row"><span class="trip-detail-label">Crew</span><span class="trip-detail-val">'+t.crew+'</span></div>':'')
    +'<div class="trip-detail-row"><span class="trip-detail-label">Type</span><span class="trip-detail-val">'+t.type+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Route</span><span class="trip-detail-val">'+t.route+'</span></div>'
    +(t.actual_route&&t.actual_route!==t.route?'<div class="trip-detail-row"><span class="trip-detail-label">Actual route</span><span class="trip-detail-val" style="color:var(--warning)">'+t.actual_route+'</span></div>':'')
    +(t.purpose?'<div class="trip-detail-row"><span class="trip-detail-label">Purpose</span><span class="trip-detail-val">'+t.purpose+'</span></div>':'')
    +'<div class="trip-detail-row"><span class="trip-detail-label">Departure</span><span class="trip-detail-val">'+(t.departure||'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Return</span><span class="trip-detail-val">'+(t.endTime||'—')+'</span></div>'
    +'</div>'
    +'<div class="trip-detail-section">'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Fuel start</span><span class="trip-detail-val">'+(t.fuelStart!==undefined?t.fuelStart+'L':'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Fuel end</span><span class="trip-detail-val">'+(t.fuelEnd!==undefined?t.fuelEnd+'L':'—')+'</span></div>'
    +'<div class="trip-detail-row"><span class="trip-detail-label">Consumed</span><span class="trip-detail-val" style="color:var(--teal);font-weight:700">'+(t.consumed!==undefined?t.consumed+'L':'—')+'</span></div>'
    +(t.fuelStartImg?'<div style="margin-top:8px"><div style="font-size:12px;color:var(--text3);margin-bottom:4px">Start meter photo</div><img src="'+t.fuelStartImg+'" class="fuel-meter-img"></div>':'')
    +(t.fuelEndImg?'<div style="margin-top:8px"><div style="font-size:12px;color:var(--text3);margin-bottom:4px">End meter photo</div><img src="'+t.fuelEndImg+'" class="fuel-meter-img"></div>':'')
    +'</div>'
    +(t.amendment_note?'<div class="trip-detail-section"><div style="font-size:12px;color:var(--text3);margin-bottom:4px">Amendment note</div><div style="font-size:13px">'+t.amendment_note+'</div></div>':'')
    +(t.admin_note?'<div class="trip-detail-section" style="border-color:#FEB2B2"><div style="font-size:12px;color:var(--danger);margin-bottom:4px">Admin note</div><div style="font-size:13px">'+t.admin_note+'</div></div>':'')
    +'<div class="action-bar">'
    +(canStart?'<button class="btn btn-teal" onclick="startTrip('+t.id+');closeModal()">Start trip</button>':'')
    +(canEnd?'<button class="btn btn-primary" onclick="endTrip('+t.id+')">End trip</button>':'')
    +(isAdmin&&t.status===STATUS.PENDING?'<button class="btn btn-teal" onclick="verifyTrip('+t.id+')">Verify</button><button class="btn btn-danger" onclick="requestCorrection('+t.id+')">Request correction</button>':'')
    +(isAdmin?'<button class="btn btn-danger" onclick="deleteTrip('+t.id+')">Delete</button>':'')
    +'</div>';
  openModal();
}

function startTrip(id){
  var trips=load('port_trips',[]);
  var idx=trips.findIndex(function(t){return t.id===id;});
  if(idx<0)return;
  var t=trips[idx];
  document.getElementById('modal-title-text').textContent='Start trip — '+t.vessel;
  document.getElementById('modal-body').innerHTML=
    '<div style="font-size:14px;color:var(--text2);margin-bottom:16px">'+t.route+(t.purpose?' · '+t.purpose:'')+'</div>'
    +'<div class="form-group"><label class="form-label">Fuel start (L) <span class="req">*</span></label>'
    +'<input class="form-input" type="number" id="st-fuel" placeholder="e.g. 120" inputmode="decimal"></div>'
    +'<div class="form-group"><label class="form-label">Departure time</label>'
    +'<input class="form-input" type="time" id="st-time" value="'+nowTime()+'"></div>'
    +'<div class="form-group"><label class="form-label">Start meter photo</label>'
    +'<div class="photo-upload" onclick="document.getElementById(\'st-img\').click()"><i class="ti ti-camera" style="font-size:20px;display:block;margin-bottom:4px"></i>Upload photo</div>'
    +'<input type="file" id="st-img" accept="image/*" style="display:none" onchange="prevImg(this,\'st-prev\')">'
    +'<img id="st-prev" class="fuel-meter-img" style="display:none"></div>'
    +'<div class="error-msg" id="st-err"></div>'
    +'<button class="btn btn-teal" onclick="confirmStart('+id+')">Confirm start</button>';
}

function prevImg(input,prevId){
  if(!input.files[0])return;
  var r=new FileReader();
  r.onload=function(e){var img=document.getElementById(prevId);img.src=e.target.result;img.style.display='block';};
  r.readAsDataURL(input.files[0]);
}

function confirmStart(id){
  var fuel=parseFloat(document.getElementById('st-fuel').value);
  if(isNaN(fuel)){var e=document.getElementById('st-err');e.textContent='Enter fuel reading';e.classList.add('show');return;}
  var time=document.getElementById('st-time').value;
  var imgEl=document.getElementById('st-prev');
  var img=imgEl&&imgEl.src&&imgEl.src.startsWith('data:')?imgEl.src:'';
  var trips=load('port_trips',[]);
  var idx=trips.findIndex(function(t){return t.id===id;});
  trips[idx].status=STATUS.IN_PROGRESS;
  trips[idx].fuelStart=fuel;
  trips[idx].departure=time;
  trips[idx].fuelStartImg=img;
  save('port_trips',trips);
  closeModal();showToast('Trip started','success');renderDashboard();
}

function endTrip(id){
  var trips=load('port_trips',[]);
  var t=trips.find(function(x){return x.id===id;});
  if(!t)return;
  document.getElementById('modal-title-text').textContent='End trip — '+t.vessel;
  document.getElementById('modal-body').innerHTML=
    '<div style="font-size:14px;color:var(--text2);margin-bottom:16px">Fuel start: <strong>'+t.fuelStart+'L</strong></div>'
    +'<div class="form-group"><label class="form-label">Fuel end (L) <span class="req">*</span></label>'
    +'<input class="form-input" type="number" id="en-fuel" placeholder="e.g. 96" inputmode="decimal" oninput="calcEndFuel()"></div>'
    +'<div class="fuel-calc"><div class="fc-val" id="en-consumed">— L</div><div class="fc-lbl">Fuel consumed</div></div>'
    +'<div class="form-group"><label class="form-label">Return time</label>'
    +'<input class="form-input" type="time" id="en-time" value="'+nowTime()+'"></div>'
    +'<div class="form-group"><label class="form-label">Actual route (if different)</label>'
    +'<input class="form-input" id="en-route" placeholder="Leave blank if same as scheduled" value="'+t.route+'"></div>'
    +'<div class="form-group"><label class="form-label">Amendment note</label>'
    +'<textarea class="form-textarea" id="en-note" placeholder="Any changes or notes..."></textarea></div>'
    +'<div class="form-group"><label class="form-label">End meter photo</label>'
    +'<div class="photo-upload" onclick="document.getElementById(\'en-img\').click()"><i class="ti ti-camera" style="font-size:20px;display:block;margin-bottom:4px"></i>Upload photo</div>'
    +'<input type="file" id="en-img" accept="image/*" style="display:none" onchange="prevImg(this,\'en-prev\')">'
    +'<img id="en-prev" class="fuel-meter-img" style="display:none"></div>'
    +'<div class="error-msg" id="en-err"></div>'
    +'<button class="btn btn-primary" onclick="confirmEnd('+id+','+t.fuelStart+')">Submit for review</button>';
  openModal();
}

function calcEndFuel(){
  var start=parseFloat(document.getElementById('modal-body').querySelector('[id="en-fuel"]')?0:0)||0;
}

function confirmEnd(id,fuelStart){
  var fuelEnd=parseFloat(document.getElementById('en-fuel').value);
  if(isNaN(fuelEnd)){var e=document.getElementById('en-err');e.textContent='Enter fuel reading';e.classList.add('show');return;}
  var consumed=Math.max(0,fuelEnd-fuelStart);
  var time=document.getElementById('en-time').value;
  var route=document.getElementById('en-route').value.trim();
  var note=document.getElementById('en-note').value.trim();
  var imgEl=document.getElementById('en-prev');
  var img=imgEl&&imgEl.src&&imgEl.src.startsWith('data:')?imgEl.src:'';
  var trips=load('port_trips',[]);
  var idx=trips.findIndex(function(t){return t.id===id;});
  trips[idx].status=STATUS.PENDING;
  trips[idx].fuelEnd=fuelEnd;
  trips[idx].consumed=consumed;
  trips[idx].endTime=time;
  trips[idx].actual_route=route;
  trips[idx].amendment_note=note;
  trips[idx].fuelEndImg=img;
  save('port_trips',trips);
  closeModal();showToast('Submitted for review','success');renderDashboard();
}

function verifyTrip(id){
  var trips=load('port_trips',[]);
  var idx=trips.findIndex(function(t){return t.id===id;});
  trips[idx].status=STATUS.VERIFIED;
  trips[idx].admin_note='';
  save('port_trips',trips);
  closeModal();showToast('Trip verified','success');renderDashboard();
}

function requestCorrection(id){
  var note=prompt('Enter correction note for captain:');
  if(note===null)return;
  var trips=load('port_trips',[]);
  var idx=trips.findIndex(function(t){return t.id===id;});
  trips[idx].status=STATUS.CORRECTION;
  trips[idx].admin_note=note;
  save('port_trips',trips);
  closeModal();showToast('Correction requested');renderDashboard();
}

function deleteTrip(id){
  if(!confirm('Delete this trip record?'))return;
  var trips=load('port_trips',[]).filter(function(t){return t.id!==id;});
  save('port_trips',trips);
  closeModal();showToast('Trip deleted');renderDashboard();
}
</script>
</body>
</html>
