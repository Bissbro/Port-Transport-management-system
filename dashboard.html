<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>PORT</h1>
      <div class="topbar-sub" id="top-date"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="role-badge" id="rb"></span>
      <button onclick="logout()" style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px">Out</button>
    </div>
  </div>
  <div class="content">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="val" id="s-today">—</div>
        <div class="lbl">Today's trips</div>
        <div class="sub" id="s-inprog">—</div>
      </div>
      <div class="stat-card">
        <div class="val" id="s-fuel">—</div>
        <div class="lbl">Fuel today</div>
        <div class="sub">Verified only</div>
      </div>
      <div class="stat-card">
        <div class="val" id="s-pending">—</div>
        <div class="lbl">Pending review</div>
        <div class="sub" id="s-pending-sub">—</div>
      </div>
      <div class="stat-card">
        <div class="val" id="s-total">—</div>
        <div class="lbl">Total trips</div>
        <div class="sub">All time</div>
      </div>
    </div>
    <div id="my-trips-section" style="display:none;margin-bottom:20px">
      <div class="section-title" id="my-trips-label">Your trips today</div>
      <div id="my-trips-list"></div>
    </div>
    <div class="section-title">Quick access</div>
    <div class="dashboard-grid">
      <div class="dashboard-card" onclick="location.href='schedule.html'">
        <div class="dc-icon dc-navy"><i class="ti ti-calendar"></i></div>
        <div><div class="dc-label">Schedule</div><div class="dc-sub" id="dc-sched">Transfers</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='fuel-report.html'">
        <div class="dc-icon dc-teal"><i class="ti ti-droplet"></i></div>
        <div><div class="dc-label">Fuel report</div><div class="dc-sub" id="dc-fuel">Consumption</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='vessels.html'">
        <div class="dc-icon dc-amber"><i class="ti ti-sailboat"></i></div>
        <div><div class="dc-label">Vessels</div><div class="dc-sub" id="dc-vessels">Fleet</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='checklist.html'">
        <div class="dc-icon dc-purple"><i class="ti ti-checklist"></i></div>
        <div><div class="dc-label">Checklist</div><div class="dc-sub">Inspection</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='team.html'">
        <div class="dc-icon" style="background:#2D3748;color:#fff"><i class="ti ti-users"></i></div>
        <div><div class="dc-label">Team</div><div class="dc-sub" id="dc-team">Members</div></div>
      </div>
      <div class="dashboard-card" onclick="location.href='admin.html'" id="admin-card" style="display:none">
        <div class="dc-icon dc-rose"><i class="ti ti-settings"></i></div>
        <div><div class="dc-label">Admin</div><div class="dc-sub">Manage</div></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <a class="nav-item active" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Home</span></a>
    <a class="nav-item" href="log.html"><i class="ti ti-plus-circle"></i><span>Log</span></a>
    <a class="nav-item" href="vessels.html"><i class="ti ti-sailboat"></i><span>Vessels</span></a>
    <a class="nav-item" href="team.html"><i class="ti ti-users"></i><span>Team</span></a>
    <a class="nav-item" href="admin.html" id="admin-nav" style="display:none">
      <i class="ti ti-settings"></i><span>Admin</span>
    </a>
  </div>
</div>

<div class="modal-overlay" id="detail-modal" onclick="closeModalOutside(event,'detail-modal')">
  <div class="modal" style="max-height:92vh;overflow-y:auto">
    <div class="modal-title">
      <span id="detail-modal-title">Trip detail</span>
      <button class="close-btn" onclick="closeModal('detail-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div id="detail-modal-body"></div>
  </div>
</div>

<div class="modal-overlay" id="form-modal" onclick="closeModalOutside(event,'form-modal')">
  <div class="modal" style="max-height:92vh;overflow-y:auto">
    <div class="modal-title">
      <span id="form-modal-title"></span>
      <button class="close-btn" onclick="closeModal('form-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div id="form-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
var session=requireAuth();
if(session){
  var isAdmin=session.role==='admin';
  document.getElementById('rb').textContent=isAdmin?'Admin':'Capt. '+session.name;
  document.getElementById('top-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  if(isAdmin){
    document.getElementById('admin-card').style.display='flex';
    document.getElementById('admin-nav').style.display='flex';
  }
  renderDashboard();
}

async function renderDashboard(){
  var today=todayStr();
  var allTrips=await dbGet('trips');
  var vessels=await dbGet('vessels');
  var team=await dbGet('team');

  var todayTrips=allTrips.filter(function(t){return t.date===today;});
  var inProg=todayTrips.filter(function(t){return t.status===STATUS.IN_PROGRESS;}).length;
  var verifiedFuel=todayTrips.filter(function(t){return t.status===STATUS.VERIFIED;}).reduce(function(a,t){return a+(parseFloat(t.consumed)||0);},0);
  var pending=allTrips.filter(function(t){return t.status===STATUS.PENDING||t.status===STATUS.CORRECTION;});
  var active=vessels.filter(function(v){return v.status==='active';}).length;
  var totalFuel=allTrips.filter(function(t){return t.status===STATUS.VERIFIED;}).reduce(function(a,t){return a+(parseFloat(t.consumed)||0);},0);

  document.getElementById('s-today').textContent=todayTrips.length;
  document.getElementById('s-inprog').textContent=inProg+' in progress';
  document.getElementById('s-fuel').textContent=verifiedFuel+'L';
  document.getElementById('s-pending').textContent=pending.length;
  document.getElementById('s-pending-sub').textContent=isAdmin?'Need approval':'Awaiting admin';
  document.getElementById('s-total').textContent=allTrips.length;
  document.getElementById('dc-sched').textContent=todayTrips.length+' today';
  document.getElementById('dc-fuel').textContent=totalFuel+'L verified';
  document.getElementById('dc-vessels').textContent=vessels.length+' · '+active+' active';
  document.getElementById('dc-team').textContent=team.length+' members';

  if(session.role==='captain'){
    var myTrips=todayTrips.filter(function(t){return t.captain===session.name;});
    if(myTrips.length){
      document.getElementById('my-trips-section').style.display='block';
      document.getElementById('my-trips-label').textContent='Your trips today ('+myTrips.length+')';
      myTrips.sort(function(a,b){return(a.departure||'').localeCompare(b.departure||'');});
      document.getElementById('my-trips-list').innerHTML=myTrips.map(function(t){
        return tripCardHTML(t,session,true);
      }).join('');
    }
  }
}
</script>
</body>
</html>
