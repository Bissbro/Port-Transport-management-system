<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PORT — Login</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="login-page">
  <div class="login-logo">PORT</div>
  <div class="login-tagline">TRANSFER MANAGEMENT</div>
  <div class="role-selector">
    <div class="role-card selected" id="card-captain" onclick="selectRole('captain')">
      <i class="ti ti-user"></i>
      <span>Captain</span>
    </div>
    <div class="role-card" id="card-admin" onclick="selectRole('admin')">
      <i class="ti ti-shield"></i>
      <span>Admin</span>
    </div>
  </div>
  <div class="pin-input" id="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key" onclick="pinClear()" style="font-size:14px">CLR</button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key" onclick="pinBack()"><i class="ti ti-backspace"></i></button>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initData();
var selectedRole='captain';
var pin='';

var s=getSession();
if(s&&s.loggedIn){window.location.href='dashboard.html';}

function selectRole(r){
  selectedRole=r;
  document.getElementById('card-captain').classList.toggle('selected',r==='captain');
  document.getElementById('card-admin').classList.toggle('selected',r==='admin');
  pin='';updateDots();
  document.getElementById('pin-error').textContent='';
}

function pinPress(d){
  if(pin.length>=4)return;
  pin+=d;
  updateDots();
  if(pin.length===4)checkPin();
}

function pinBack(){pin=pin.slice(0,-1);updateDots();}
function pinClear(){pin='';updateDots();}

function updateDots(){
  for(var i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled',i<pin.length);
  }
}

function checkPin(){
  if(pin===PINS[selectedRole]){
    setSession(selectedRole);
    window.location.href='dashboard.html';
  } else {
    document.getElementById('pin-error').textContent='Incorrect PIN. Try again.';
    pin='';
    setTimeout(function(){updateDots();},300);
  }
}
</script>
</body>
</html>
